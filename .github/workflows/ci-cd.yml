name: Huy Khang Book Shop - CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ========================================================
  # 1. CI: Kiểm tra biên dịch & Build source code .NET 10
  # ========================================================
  build-and-test:
    name: Build & Verify .NET 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore WebApplication1/WebApplication1.csproj

      - name: Build Project (Release Mode)
        run: dotnet build WebApplication1/WebApplication1.csproj --configuration Release --no-restore

      - name: Publish Artifacts
        run: dotnet publish WebApplication1/WebApplication1.csproj -c Release -o ./publish /p:UseAppHost=false

  # ========================================================
  # 2. CI: Kiểm tra Docker Image Build
  # ========================================================
  docker-check:
    name: Test Docker Image Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: huykhangshop:latest

  # ========================================================
  # 3. CD: Tự động kích hoạt Deploy lên Cloud (Render/Webhook)
  # ========================================================
  deploy-to-cloud:
    name: Continuous Deployment (CD)
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-check]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Trigger Render Deploy Hook (if configured)
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            echo "🚀 Đang kích hoạt Deploy tự động lên Render qua Deploy Hook..."
            curl -X POST "$RENDER_HOOK"
            echo "✅ Đã gửi tín hiệu deploy thành công!"
          else
            echo "ℹ️ Chưa cấu hình secret RENDER_DEPLOY_HOOK_URL trong GitHub Secrets."
            echo "💡 Nếu bạn đã bật Auto-Deploy trên Render, Render sẽ tự động pull commit mới và deploy mà không cần hook."
          fi
